[build]
  publish = "."

# ivizhin.ai is the primary name. Netlify only redirects the www/apex variants of the primary and the
# netlify.app name on its own, so ivizhin.com is sent to ivizhin.ai here. One name in search results,
# one name on business cards.
[[redirects]]
  from = "https://ivizhin.com/*"
  to = "https://ivizhin.ai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ivizhin.com/*"
  to = "https://ivizhin.ai/:splat"
  status = 301
  force = true

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
