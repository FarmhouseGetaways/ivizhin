[build]
  publish = "."

# ivizhin.ai is the primary name. ivizhin.com and both www names are set as redirects to it in
# Netlify → Domain management, so nothing is needed here for them.

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
