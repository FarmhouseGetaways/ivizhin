[build]
  publish = "."

# ivizhin.ai is meant to be the primary name, with ivizhin.com sent to it. On 14 Oct 2026 ivizhin.ai was
# suspended by directnic's ICANN email verification (nameservers at emailverification.info), so the
# redirect would send everyone to a dead name. ivizhin.com is primary until the .ai is reactivated.
# When it is: make ivizhin.ai primary in Netlify → Domain management and uncomment these two blocks.
#
# [[redirects]]
#   from = "https://ivizhin.com/*"
#   to = "https://ivizhin.ai/:splat"
#   status = 301
#   force = true
#
# [[redirects]]
#   from = "https://www.ivizhin.com/*"
#   to = "https://ivizhin.ai/:splat"
#   status = 301
#   force = true

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
